<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POPOPHONE · Admin</title><link rel="stylesheet" href="css/operations.css?v=17.2"><link rel="stylesheet" href="css/admin.css?v=17.2"></head>
<body class="ops-app admin-app"><div class="ops-shell"><header class="ops-header"><div><span class="ops-brand">POPOPHONE · ADMIN</span><h1 id="pageTitle">Tổng quan</h1></div><button onclick="refreshAll()" aria-label="Làm mới">↻</button></header><div class="ops-user"><div><b id="userName"></b><span id="userRole"></span></div><button onclick="logout()">Đăng xuất</button></div><a class="admin-operations-link" href="dashboard.html">Theo dõi sửa chữa · KT nhận / CH nhận →</a>
<div id="overviewTopFilters" class="global-filter-bar" aria-label="Bộ lọc dùng chung">
          <label class="global-filter-item global-filter-branch" title="Lọc theo chi nhánh">
            <span class="global-filter-label">Chi nhánh</span>
            <select id="globalBranch" onchange="applyGlobalFilters()" aria-label="Chi nhánh">
              <option value="">Tất cả CN</option>
              
            </select>
          </label>

          <span class="global-filter-separator" aria-hidden="true"></span>

          <label class="global-filter-item global-filter-mode" title="Kiểu thời gian">
            <span class="global-filter-label">Thời gian</span>
            <select id="overviewMode" onchange="changeOverviewMode()" aria-label="Kiểu thời gian">
              <option value="month">Theo tháng</option>
              <option value="range">Khoảng thời gian</option>
            </select>
          </label>

          <label id="overviewMonthWrap" class="global-filter-item global-filter-value" title="Chọn tháng">
            <span class="global-filter-label">Tháng</span>
            <input type="month" id="overviewMonth" onchange="applyGlobalFilters()" />
          </label>

          <div id="overviewRangeWrap" class="global-filter-range" style="display:none">
            <label class="global-filter-item global-filter-date" title="Từ ngày">
              <span class="global-filter-label">Từ ngày</span>
              <input type="date" id="overviewFrom" onchange="applyGlobalFilters()" />
            </label>
            <span class="global-range-arrow" aria-hidden="true">→</span>
            <label class="global-filter-item global-filter-date" title="Đến ngày">
              <span class="global-filter-label">Đến ngày</span>
              <input type="date" id="overviewTo" onchange="applyGlobalFilters()" />
            </label>
          </div>

          <button class="ghost-btn global-filter-reset" type="button" onclick="resetOverviewFilters()" title="Đặt lại bộ lọc" aria-label="Đặt lại bộ lọc">↺</button>
        </div>

        <div class="ops-toolbar"><nav id="navMenu" class="ops-nav"><button data-tab="overview">Tổng quan</button><button data-tab="cost">Chi phí lợi nhuận</button><button data-tab="materials">Vật tư</button><button data-tab="weeklyReport">Báo cáo</button></nav></div><p id="overviewDataStatus" class="overview-data-status" role="status"></p><main><section id="overview" class="tab">
<div class="ops-daily-head"><h2>Tài chính trong kỳ</h2><span id="adminPeriodLabel"></span></div>
<div id="adminFinance" class="ops-kpis admin-finance"></div>
<div id="adminSummary" class="ops-period-summary"></div>
<section class="ops-section"><h2>Doanh thu theo tuần</h2><div id="weekChart" class="admin-week-list"></div></section>
<section class="ops-section"><h2>Phân bổ loại dịch vụ</h2><div id="serviceTypeDist"></div></section>
<section class="ops-section"><h2>Top dịch vụ</h2><div id="topServices"></div></section>
<section class="ops-section"><h2>Dịch vụ theo dòng máy</h2><div class="matrix-toolbar"><input id="matrixModelFilter" placeholder="Tìm dòng máy" oninput="renderMatrix()"><input id="matrixServiceFilter" placeholder="Tìm dịch vụ" oninput="renderMatrix()"><select id="matrixLimit" onchange="renderMatrix()"><option value="20">Top 20 dòng máy</option><option value="40">Top 40 dòng máy</option><option value="999">Tất cả</option></select></div><div id="serviceMatrix"></div></section>
</section><section id="cost" class="tab">
        <div class="panel">
          <div class="panel-head"><div><h3>Cập nhật chi phí</h3></div></div>
          <div class="filter-row">
            <select id="costScope" onchange="renderCostTable()"><option value="missing">Chưa nhập chi phí</option><option value="all">Tất cả đơn trong kỳ</option></select><input id="costQ" placeholder="Tìm mã/IMEI/SĐT" oninput="renderCostTable()" />
            <select id="costStatus" onchange="renderCostTable()"><option value="">Trạng thái</option></select>
            <select id="costPayment" onchange="renderCostTable()"><option value="">Thanh toán</option><option>Chưa thanh toán</option><option>Đã thanh toán</option></select>
            <input id="costMaterialQ" placeholder="Vật tư/NCC" oninput="renderCostTable()" />
            <button class="ghost-btn" onclick="renderCostTable()">Lọc</button>
          </div>
          <div id="costTable" class="table-wrap"></div>
        </div>
      </section><section id="materials" class="tab">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h3>Vật tư sử dụng</h3>
            </div>
          </div>
          <div class="filter-row"><input id="materialSearch" placeholder="Tìm vật tư" oninput="renderMaterialsFull()"><select id="materialGroup" onchange="renderMaterialsFull()"><option value="">Tất cả nhóm</option></select><select id="materialCatalogScope" onchange="renderMaterialsFull()"><option value="used">Vật tư đã dùng</option><option value="all">Tất cả danh mục</option></select></div><div id="materialsFull" class="table-wrap"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h3>Tổng quan NCC sử dụng vật tư</h3>

            </div>
          </div>
          <div id="materialsFullSupplierKpis" class="kpi-grid compact"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h3>Phân tích theo NCC</h3>

            </div>
          </div>
          <div id="materialsFullSupplierSummary" class="table-wrap"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h3>Top vật tư theo NCC</h3>

            </div>
          </div>
          <div id="materialsFullSupplierMaterials" class="supplier-grid"></div>
        </div>
      </section><section id="weeklyReport" class="tab">
        <div class="panel">
          <div class="panel-head">
            <button class="primary-btn" onclick="printWeeklyReport()">Xuất PDF / In báo cáo</button>
          </div>
          <div class="filter-row report-filter-row">
            <select id="reportWeek" onchange="renderWeeklyReport()">
              <option value="">Cả kỳ đã chọn</option>
              <option value="1">Tuần 1</option>
              <option value="2">Tuần 2</option>
              <option value="3">Tuần 3</option>
              <option value="4">Tuần 4</option>
              <option value="5">Tuần 5</option>
            </select>
            <button class="ghost-btn" onclick="renderWeeklyReport()">Tạo báo cáo</button>
          </div>
          <div id="weeklyReportPreview" class="report-preview-wrap"></div>
        </div>
      </section></main></div><div id="modal" class="modal"></div><div id="printArea" class="print-area"></div><script src="js/config.js?v=17.1"></script><script src="js/auth.js?v=17.1"></script><script src="js/admin.js?v=17.2"></script></body></html>
