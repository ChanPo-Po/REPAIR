<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập POPOPHONE Repair</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo">P</div>
      <h1>POPOPHONE REPAIR </h1>
      <p>Đăng nhập quản trị</p>

      <form id="loginForm" class="login-form">
        <input id="username" placeholder="Tài khoản" autocomplete="username" />
        <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
        <button class="primary-btn" type="submit">Đăng nhập</button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
